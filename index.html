<!doctype html>
<html lang="en" data-theme="dark" data-furigana="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Kotoba — a personal Genki vocabulary trainer with spaced repetition." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kotoba" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Kotoba 言葉</title>
    <script>
      // Apply saved theme before first paint (avoids a light flash).
      try {
        var s = JSON.parse(localStorage.getItem('kotoba.settings') || '{}')
        var dark = s.theme === 'light' ? false : s.theme === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : true
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.furigana = s.furigana === false ? 'off' : 'on'
        if (s.lang) document.documentElement.lang = s.lang
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
