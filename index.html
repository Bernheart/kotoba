<!doctype html>
<html lang="en" data-theme="dark" data-furigana="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Kotoba — a personal Genki vocabulary trainer with spaced repetition." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kotoba" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="./splash/splash-375x667@2x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-390x844@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-393x852@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-402x874@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-428x926@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-430x932@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-440x956@3x.png" />
    <title>Kotoba 言葉</title>
    <script>
      // Apply saved theme before first paint (avoids a light flash).
      try {
        var s = JSON.parse(localStorage.getItem('kotoba.settings') || '{}')
        var dark = s.theme === 'light' ? false : s.theme === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : true
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.furigana = s.furigana === false ? 'off' : 'on'
        if (s.lang) document.documentElement.lang = s.lang
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the app fails to start (e.g. an unsupported browser), show the error instead of a blank screen.
      ;(function () {
        function show(msg) {
          if (document.getElementById('root').childElementCount) return
          var el = document.getElementById('boot-error') || document.createElement('pre')
          el.id = 'boot-error'
          el.style.cssText = 'white-space:pre-wrap;color:#ece6dc;font:13px ui-monospace,monospace;padding:calc(24px + env(safe-area-inset-top)) 20px 20px'
          el.textContent = 'Kotoba could not start:\n\n' + msg
          document.body.appendChild(el)
        }
        window.addEventListener('error', function (e) { show((e.message || e) + '\n' + (e.filename || '') + ':' + (e.lineno || '')) })
        window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && (e.reason.stack || e.reason.message) || e.reason)) })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
